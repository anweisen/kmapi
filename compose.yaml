# kmapi with its Redis cache and MongoDB archive.
#   docker compose up -d        -> http://localhost:8080
# Change the published port with KMAPI_PORT, e.g. KMAPI_PORT=5000 docker compose up -d

name: kmapi

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  kmapi:
    build: .
    image: kmapi:local
    restart: unless-stopped
    ports:
      - "${KMAPI_PORT:-8080}:80"
    environment:
      BIND_ADDR: ":80"
      REDIS_URL: "redis:6379"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "kmapi"
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *logging

  # pure cache (24 h TTL): nothing persisted, least recently used keys go first when full
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  # archive of every scraped year, answers when km.bayern.de cannot be read
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging: *logging

volumes:
  mongo-data:
